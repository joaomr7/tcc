[project]
name = "tcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "datasets==3.6.0",
    "faiss-cpu>=1.14.3",
    "graphrag>=3.1.2",
    "ipykernel>=7.2.0",
    "langchain>=1.3.4",
    "langchain-graph-retriever>=0.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "matplotlib>=3.11.1",
    "torch",
    "transformers>=5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.uv.workspace]
members = [
    "multihop_chunker",
]
